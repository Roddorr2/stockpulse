version: "3.8"

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: stockpulse-postgres-test
    environment:
      POSTGRES_DB: stockpulse_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockpulse_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockpulse-backend-test
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-test:5432/stockpulse_test
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health -S 2>&1 | grep -q '200\\|401' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stockpulse-frontend-test
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      backend-test:
        condition: service_healthy
